
<section id="contact-section" class="contact-section">
    <div class="container">
        <span class="section-label">Get In Touch</span>
        <h2>Contact Me</h2>
        <p>Have a project or collaboration idea? Let's connect.</p>

        <div class="contact-grid">
            <div class="contact-info">
                <h3>Let's Work Together</h3>
                <p>
                    I'm interested in development projects,
                    collaboration and new opportunities.
                </p>

                <a href="https://github.com/codersusheel"
                   target="_blank" rel="noopener noreferrer">
                    GitHub
                </a>

                <a href="https://www.linkedin.com/in/codersusheel/"
                   target="_blank" rel="noopener noreferrer">
                    LinkedIn
                </a>
            </div>

            <form class="contact-form" id="contactForm">
                <label for="contactName">Your Name</label>
                <input type="text" id="contactName"
                       name="name" placeholder="Enter your name" required>

                <label for="contactEmail">Email Address</label>
                <input type="email" id="contactEmail"
                       name="email" placeholder="Enter your email" required>

                <label for="contactMessage">Message</label>
                <textarea id="contactMessage" name="message"
                          rows="5" placeholder="Write your message"
                          required></textarea>

                <button type="submit">Send Message</button>
                <p class="form-note">
                    Demo form — connect a form service to receive messages.
                </p>
            </form>
        </div>
    </div>
</section>
