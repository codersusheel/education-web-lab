<header id="header" class="site-header">

    <div class="header-container">

        <a href="/" class="header-brand">
            <div class="brand-icon">
                <i class="fa-solid fa-code"></i>
            </div>

            <div class="brand-details">
                <strong>Modular</strong>
                <small>By Haproven</small>
            </div>
        </a>

        <nav class="desktop-nav">
            <ul id="header-links"></ul>
        </nav>

        <div class="header-actions">

            <button id="theme-toggle"
                    class="header-icon-btn"
                    type="button"
                    aria-label="Toggle theme">
                <i class="fa-solid fa-moon"></i>
            </button>

            <div class="apps-wrapper">

                <button id="dot6menu"
                        class="header-icon-btn apps-trigger"
                        type="button"
                        aria-label="Open apps"
                        aria-expanded="false">

                    <span class="six-dots">
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                    </span>
                </button>

                <div id="teamDropdown" class="apps-dropdown">

                    <div class="dropdown-heading">
                        <strong>Haproven Ecosystem</strong>
                        <small>Explore our platforms</small>
                    </div>

                    <div id="by-haproven" class="apps-grid"></div>

                </div>

            </div>

            <button id="mobile-menu-toggle"
                    class="header-icon-btn mobile-toggle"
                    type="button"
                    aria-label="Toggle navigation"
                    aria-expanded="false">

                <span></span>
                <span></span>
                <span></span>

            </button>

        </div>

    </div>

    <nav id="navbar-mobile" class="mobile-navigation">

        <div class="mobile-nav-heading">
            <strong>Navigation</strong>

            <button id="mobile-close"
                    type="button"
                    aria-label="Close navigation">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <ul id="mobile-sidebar"></ul>

        <div class="mobile-nav-bottom">

            <div class="mobile-language">
                <span>Language</span>
                <button id="langBtn" type="button">हिंदी</button>
            </div>

            <div class="mobile-social haproven-sosal-links"></div>

            <p>Powered by Haproven</p>

        </div>

    </nav>

    <div id="header-overlay" class="header-overlay"></div>

</header>
